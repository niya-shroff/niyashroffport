[build]
  # Run from the root directory to access the Makefile
  base = "/"

  # Directory that contains the deploy-ready HTML files and assets generated by the build
  publish = "frontend/dist/"

  # Default build command to bundle the frontend
  command = "make build-frontend"

# The following redirect is intended for use with most SPAs (like Vite + React Router)
# that handle routing internally, ensuring all requests serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
